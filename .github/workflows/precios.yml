name: Actualizar precios de fondos

on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar precios
        run: python scripts/precios.py
      - name: Guardar precios.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Precios de fondos $(date -u +%F)"
            git push
          fi
